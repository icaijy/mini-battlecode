name: Test generic Mini Battlecode engine
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check dependencies
        run: g++ --version
      - name: Engine regression tests (synthetic temporary plugin)
        run: python3 -m unittest discover -s tests -v
      - name: Install CLI
        run: ./install.sh
      - name: Check CLI from outside repository
        run: cd /tmp && "$HOME/.local/bin/mbc" doctor
