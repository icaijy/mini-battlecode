name: Test mini-battlecode
on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check compiler
        run: g++ --version
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Install CLI in Linux home
        run: ./install.sh
      - name: Verify CLI in another directory
        run: |
          cd /tmp
          "$HOME/.local/bin/mbc" doctor --season courier_s1
      - name: Verify contestant kit
        run: "$HOME/.local/bin/mbc" kit --season courier_s1 --out /tmp/courier_s1.zip
